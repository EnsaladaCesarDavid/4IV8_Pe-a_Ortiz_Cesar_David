<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comisión Por Ventas</title>
    <link rel="stylesheet" href="./CSS/02CSS.css" />
    <script src="./JS/02JS.js"></script>
  </head>
  <body>
    <div class="card">
      <h3>Cálculo de Sueldo Mensual</h3>

      <label for="sueldoBase">Sueldo Base:</label>
      <input type="number" id="sueldoBase" placeholder="Ingrese el sueldo base" step="0.01" />

      <label>Monto de las 3 ventas:</label>
      <input type="number" class="venta" placeholder="Venta 1" step="0.01" />
      <input type="number" class="venta" placeholder="Venta 2" step="0.01" />
      <input type="number" class="venta" placeholder="Venta 3" step="0.01" />

      <button onclick="calcularSueldoTotal()">Calcular Total</button>

      <div class="result" id="resultado"></div>
    </div>
  </body>
</html>
